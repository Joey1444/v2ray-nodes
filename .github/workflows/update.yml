name: update-nodes

on:
  schedule:
    # 每 6 小时一次，分钟数错开整点（降负载，也避开 :00 的调度高峰）
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-nodes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 Xray（用于真实代理验证）
        run: |
          curl -sL -o /tmp/xray.zip \
            https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -q -o /tmp/xray.zip -d /tmp/xraybin
          chmod +x /tmp/xraybin/xray
          /tmp/xraybin/xray version | head -1
          echo "/tmp/xraybin" >> "$GITHUB_PATH"

      - name: 抓取 / 清洗 / 归属过滤 / 真实代理验证
        run: python filter.py

      - name: 有变化才提交
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sub.txt sub-plain.txt sources.txt sources-status.json
          if git diff --cached --quiet; then
            echo "本次无变化，跳过提交"
          else
            git commit -m "更新节点 $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
